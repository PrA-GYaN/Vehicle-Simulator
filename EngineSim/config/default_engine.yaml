# Default engine configuration for Engine Simulator v0.1
#
# Units:
#   displacement_liters: liters (converted to m^3 internally)
#   inertia: kg·m^2
#   rpm: rev/min (converted to rad/s internally)
#   torque: N·m
#   friction coefficients: Pa (N/m^2)
#
# Sources: ENGINE_KB.md Parts XVII, XXIV.

engine:
  name: "Generic 2.0L SI 4-cyl"

  # Engine displacement [liters]
  # KB §I Table 1.3: small passenger cars 15-75 kW SI 4-stroke
  displacement_liters: 2.0

  # Compression ratio [-]
  # KB §I Eq 2.1: SI 8-12
  compression_ratio: 10.0

  # Rotational inertia [kg·m^2]
  # KB Part XVII §E, Eq 14.52
  engine_inertia_kgm2: 0.10

  # Load inertia [kg·m^2] (0 for engine-only / dyno)
  load_inertia_kgm2: 0.0

  # Speed limits [RPM]
  # KB Part XXI §37
  idle_rpm: 800
  redline_rpm: 7000
  limiter_type: "torque_cut"
  limiter_hysteresis_rpm: 200

  # Friction model coefficients [Pa]
  # KB Eq 13.5: tfmep = C1 + C2*N + C3*N^2
  # KB Eq 13.6 (SI): tfmep(bar) = 0.97 + 0.15(N/1000) + 0.05(N/1000)^2
  # Converted from bar to Pa: 1 bar = 100,000 Pa
  friction:
    C1_Pa: 97000.0      # 0.97 bar
    C2_Pa_per_rev_s: 900.0     # 0.15 bar per 1000 rpm = 900 Pa per rev/s
    C3_Pa_per_rev_s2: 18.0    # 0.05 bar per (1000 rpm)^2 = 18 Pa per (rev/s)^2

  # WOT brake torque curve [RPM, N·m]
  # Values derived from KB §I §2.7 typical bmep data:
  #   T = bmep × V_d / (4π)  [KB Eq 15.2]
  #   For NA SI: bmep_max ≈ 925 kPa (KB worked example p.51)
  #   T_max ≈ 925e3 × 2.0e-3 / (4π) ≈ 147 N·m
  # These are authored configuration values, not derived from KB equations.
  torque_curve:
    - { rpm: 500, torque: 60.0 }
    - { rpm: 1000, torque: 100.0 }
    - { rpm: 1500, torque: 130.0 }
    - { rpm: 2000, torque: 155.0 }
    - { rpm: 2500, torque: 170.0 }
    - { rpm: 3000, torque: 180.0 }
    - { rpm: 3500, torque: 185.0 }
    - { rpm: 4000, torque: 182.0 }
    - { rpm: 4500, torque: 175.0 }
    - { rpm: 5000, torque: 165.0 }
    - { rpm: 5500, torque: 152.0 }
    - { rpm: 6000, torque: 138.0 }
    - { rpm: 6500, torque: 120.0 }
    - { rpm: 7000, torque: 100.0 }
